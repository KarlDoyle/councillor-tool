# Dependency updates, proposed weekly as ONE grouped PR per ecosystem — never merged
# automatically. Added 2026-09-18 (moss check found no dependency-update config here).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-all:
        patterns: ["*"]

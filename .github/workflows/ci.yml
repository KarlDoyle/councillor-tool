name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check refresh script syntax
        run: node --check scripts/refresh.mjs
      - name: Test refresh helpers and checked-in data
        run: node --test scripts/refresh.test.mjs
